name: Code Genius Threat Model

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  threat-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install code_genius
        run: |
          # Replace with the real download link for the Linux binary
          curl -fsSL -o code_genius "https://YOUR-DOWNLOAD-URL"
          chmod +x code_genius
          sudo mv code_genius /usr/local/bin/

      - name: Run threat model analysis
        env:
          CG_CLIENT_ID: ${{ secrets.CG_CLIENT_ID }}
          CG_CLIENT_SECRET: ${{ secrets.CG_CLIENT_SECRET }}
        run: code_genius repo .
