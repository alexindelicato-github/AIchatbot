name: Code Genius Threat Model

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  threat-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch code_genius
        uses: actions/checkout@v4
        with:
          repository: alexindelicato-github/cg-binary
          token: ${{ secrets.BINARY_REPO_TOKEN }}
          path: cg-binary

      - name: Install code_genius
        run: |
          sudo install -m 755 cg-binary/code_genius-linux-amd64 /usr/local/bin/code_genius
          rm -rf cg-binary

      - name: Run threat model analysis
        env:
          CG_CLIENT_ID: ${{ secrets.CG_CLIENT_ID }}
          CG_CLIENT_SECRET: ${{ secrets.CG_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: code_genius repo .
